<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiseShell Terminal</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020617;
    }

    #terminal {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 10px 12px 18px;
      overflow: auto;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 18px/1.35 Consolas, "Cascadia Mono", "Microsoft YaHei UI", monospace;
      color: #e2e8f0;
      background: #020617;
      caret-color: #38bdf8;
      user-select: text;
    }

    #terminal::selection {
      background: #1e293b;
    }
  </style>
</head>
<body>
  <pre id="terminal" tabindex="0" contenteditable="plaintext-only" spellcheck="false"></pre>
  <script>
    (() => {
      const terminal = document.getElementById("terminal");
      const maxBufferLength = 1000000;
      let buffer = "";
      let segments = [];
      let activeStyle = createDefaultStyle();
      let pendingCarriageReturn = false;
      let options = {
        fontSize: 18,
        fontFamily: "Consolas, 'Cascadia Mono', 'Microsoft YaHei UI', monospace",
        scrollback: 3000,
        theme: {
          background: "#020617",
          foreground: "#e2e8f0",
          cursor: "#38bdf8",
          selectionBackground: "#1e293b"
        }
      };
      let resizeTimer = 0;

      function post(kind, payload = {}) {
        const message = JSON.stringify({ kind, ...payload });
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      function escapeCssValue(value) {
        return String(value || "").replace(/["\\]/g, "\\$&");
      }

      function applyOptions(next) {
        options = { ...options, ...(next || {}) };
        const theme = options.theme || {};

        terminal.style.fontSize = `${Number(options.fontSize) || 18}px`;
        terminal.style.fontFamily = options.fontFamily || "Consolas, 'Cascadia Mono', monospace";
        terminal.style.background = theme.background || "#020617";
        terminal.style.color = theme.foreground || "#e2e8f0";
        terminal.style.caretColor = theme.cursor || "#38bdf8";

        document.documentElement.style.setProperty("--selection-background", theme.selectionBackground || "#1e293b");
        document.head.querySelector("style").appendChild(
          document.createTextNode(`#terminal::selection{background:${escapeCssValue(theme.selectionBackground || "#1e293b")};}`)
        );

        trimBuffer();
        render();
        scheduleResize();
      }

      function normalizeOutput(text, keepTrailingCarriageReturn) {
        let output = String(text || "");
        if (pendingCarriageReturn) {
          output = "\r" + output;
          pendingCarriageReturn = false;
        }

        if (keepTrailingCarriageReturn && output.endsWith("\r")) {
          output = output.slice(0, -1);
          pendingCarriageReturn = true;
        }

        output = output.replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, "");
        output = output.replace(/\x1b[()][A-Za-z0-9]/g, "");
        output = output.replace(/\r\n/g, "\n");
        output = output.replace(/\r/g, "\n");
        output = output.replace(/[\x08\x7f]/g, "\b");
        return output;
      }

      function appendOutput(text) {
        const output = normalizeOutput(text, true);
        appendParsedOutput(output);
        trimBuffer();
        render();
      }

      function replaceOutput(text) {
        pendingCarriageReturn = false;
        buffer = "";
        segments = [];
        activeStyle = createDefaultStyle();
        appendParsedOutput(normalizeOutput(text, false));
        trimBuffer();
        render();
      }

      function appendParsedOutput(output) {
        for (let index = 0; index < output.length;) {
          if (output[index] === "\x1b" && output[index + 1] === "[") {
            const match = /^\x1b\[([0-9;?]*)([@-~])/.exec(output.slice(index));
            if (match) {
              if (match[2] === "m") {
                applySgr(match[1]);
              }

              index += match[0].length;
              continue;
            }
          }

          const ch = output[index];
          if (ch === "\b") {
            removeLastCharacter();
          } else if (isIgnoredControlCharacter(ch)) {
            // Ignore terminal controls such as BEL so they are not rendered as boxes.
          } else {
            appendStyledText(ch);
          }

          index += 1;
        }
      }

      function isIgnoredControlCharacter(ch) {
        const code = ch.charCodeAt(0);
        return (code >= 0 && code < 32 && ch !== "\n" && ch !== "\t") || code === 127;
      }

      function createDefaultStyle() {
        return { foreground: "", bold: false };
      }

      function cloneStyle(style) {
        return { foreground: style.foreground, bold: style.bold };
      }

      function stylesEqual(left, right) {
        return left.foreground === right.foreground && left.bold === right.bold;
      }

      function appendStyledText(text) {
        if (!text) {
          return;
        }

        buffer += text;
        const last = segments[segments.length - 1];
        if (last && stylesEqual(last.style, activeStyle)) {
          last.text += text;
          return;
        }

        segments.push({ text, style: cloneStyle(activeStyle) });
      }

      function removeLastCharacter() {
        if (!buffer) {
          return;
        }

        buffer = buffer.slice(0, -1);
        while (segments.length > 0) {
          const last = segments[segments.length - 1];
          if (last.text.length > 1) {
            last.text = last.text.slice(0, -1);
            return;
          }

          segments.pop();
          return;
        }
      }

      function applySgr(rawParameters) {
        const parameters = rawParameters
          ? rawParameters.split(";").map(value => value === "" ? 0 : Number(value))
          : [0];

        for (const parameter of parameters) {
          if (parameter === 0) {
            activeStyle = createDefaultStyle();
          } else if (parameter === 1) {
            activeStyle.bold = true;
          } else if (parameter === 22) {
            activeStyle.bold = false;
          } else if (parameter === 39) {
            activeStyle.foreground = "";
          } else if ((parameter >= 30 && parameter <= 37) || (parameter >= 90 && parameter <= 97)) {
            activeStyle.foreground = ansiForeground(parameter);
          }
        }
      }

      function ansiForeground(code) {
        const colors = {
          30: "#0f172a",
          31: "#f87171",
          32: "#22c55e",
          33: "#facc15",
          34: "#38bdf8",
          35: "#c084fc",
          36: "#22d3ee",
          37: "#e2e8f0",
          90: "#64748b",
          91: "#fb7185",
          92: "#4ade80",
          93: "#fde047",
          94: "#38bdf8",
          95: "#d8b4fe",
          96: "#67e8f9",
          97: "#f8fafc"
        };

        return colors[code] || "";
      }

      function trimBuffer() {
        const scrollback = Math.max(500, Number(options.scrollback) || 3000);
        const lines = buffer.split("\n");
        if (lines.length > scrollback) {
          const nextBuffer = lines.slice(lines.length - scrollback).join("\n");
          trimLeadingCharacters(buffer.length - nextBuffer.length);
        }

        if (buffer.length > maxBufferLength) {
          trimLeadingCharacters(buffer.length - maxBufferLength);
        }
      }

      function render() {
        const wasNearBottom = terminal.scrollTop + terminal.clientHeight >= terminal.scrollHeight - 24;
        terminal.innerHTML = segments.map(renderSegment).join("");
        if (wasNearBottom) {
          terminal.scrollTop = terminal.scrollHeight;
        }

        placeCaretAtEnd();
      }

      function trimLeadingCharacters(count) {
        if (count <= 0) {
          return;
        }

        buffer = buffer.slice(count);
        let remaining = count;
        while (remaining > 0 && segments.length > 0) {
          const first = segments[0];
          if (first.text.length > remaining) {
            first.text = first.text.slice(remaining);
            return;
          }

          remaining -= first.text.length;
          segments.shift();
        }
      }

      function renderSegment(segment) {
        const text = escapeHtml(segment.text);
        const styles = [];
        if (segment.style.foreground) {
          styles.push(`color:${segment.style.foreground}`);
        }

        if (segment.style.bold) {
          styles.push("font-weight:700");
        }

        return styles.length === 0
          ? text
          : `<span style="${styles.join(";")}">${text}</span>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function placeCaretAtEnd() {
        const selection = window.getSelection();
        if (!selection) {
          return;
        }

        const range = document.createRange();
        const lastTextNode = findLastTextNode(terminal);
        if (lastTextNode) {
          range.setStart(lastTextNode, lastTextNode.nodeValue.length);
        } else {
          range.selectNodeContents(terminal);
          range.collapse(false);
        }

        selection.removeAllRanges();
        selection.addRange(range);
        terminal.focus({ preventScroll: true });
      }

      function findLastTextNode(node) {
        for (let index = node.childNodes.length - 1; index >= 0; index -= 1) {
          const child = node.childNodes[index];
          if (child.nodeType === Node.TEXT_NODE) {
            return child;
          }

          const nested = findLastTextNode(child);
          if (nested) {
            return nested;
          }
        }

        return null;
      }

      function focusTerminal() {
        terminal.focus({ preventScroll: true });
        placeCaretAtEnd();
      }

      function sendInput(text) {
        if (text) {
          post("input", { text });
        }
      }

      function scheduleResize() {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(sendResize, 80);
      }

      function sendResize() {
        const probe = document.createElement("span");
        probe.textContent = "M";
        probe.style.visibility = "hidden";
        probe.style.position = "absolute";
        probe.style.font = getComputedStyle(terminal).font;
        document.body.appendChild(probe);

        const charWidth = Math.max(1, probe.getBoundingClientRect().width);
        const lineHeight = Math.max(1, parseFloat(getComputedStyle(terminal).lineHeight));
        probe.remove();

        const styles = getComputedStyle(terminal);
        const width = terminal.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
        const height = terminal.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
        post("resize", {
          columns: Math.max(20, Math.floor(width / charWidth)),
          rows: Math.max(5, Math.floor(height / lineHeight))
        });
      }

      terminal.addEventListener("keydown", event => {
        if (event.ctrlKey && event.key.toLowerCase() === "c") {
          const selectedText = String(window.getSelection());
          if (selectedText) {
            post("copy", { text: selectedText });
            event.preventDefault();
            return;
          }
        }

        if (event.ctrlKey && event.key.toLowerCase() === "v") {
          post("pasteRequest");
          event.preventDefault();
          return;
        }

        if (event.altKey || event.metaKey) {
          return;
        }

        const controlMap = {
          Enter: "\r",
          Backspace: "\x7f",
          Tab: "\t",
          Escape: "\x1b",
          ArrowUp: "\x1b[A",
          ArrowDown: "\x1b[B",
          ArrowRight: "\x1b[C",
          ArrowLeft: "\x1b[D",
          Home: "\x1b[H",
          End: "\x1b[F",
          Delete: "\x1b[3~",
          PageUp: "\x1b[5~",
          PageDown: "\x1b[6~"
        };

        if (controlMap[event.key]) {
          sendInput(controlMap[event.key]);
          event.preventDefault();
          return;
        }

        if (event.ctrlKey && event.key.length === 1) {
          const code = event.key.toUpperCase().charCodeAt(0);
          if (code >= 64 && code <= 95) {
            sendInput(String.fromCharCode(code - 64));
            event.preventDefault();
          }

          return;
        }

        if (event.key.length === 1 && !event.ctrlKey) {
          sendInput(event.key);
          event.preventDefault();
        }
      });

      terminal.addEventListener("paste", event => {
        const text = event.clipboardData && event.clipboardData.getData("text");
        if (text) {
          sendInput(text);
          event.preventDefault();
        }
      });

      terminal.addEventListener("contextmenu", event => event.preventDefault());
      terminal.addEventListener("mousedown", () => window.setTimeout(focusTerminal, 0));
      window.addEventListener("resize", scheduleResize);

      window.sshStudio = {
        applyOptions,
        appendOutput,
        replaceOutput,
        focusTerminal
      };

      focusTerminal();
      scheduleResize();
    })();
  </script>
</body>
</html>
